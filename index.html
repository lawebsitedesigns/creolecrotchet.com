  <title>creolecrotchet.com | Annjanea</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ===== Header ===== -->

    <div class="topbar">
      <div>📞 (337) 680-0116</div>
      <div>✉️ hello@creolecrotchet.com</div>

    <div class="branding">
      <h1>creolecrotchet.com</h1>

          <div class="slide"><img src="images/product9.jpg" alt="Product 9"></div>
          <div class="slide"><img src="images/product10.jpg" alt="Product 10"></div>

      <div class="controls">
        <button class="btn" id="prev">◀ Prev</button>
        <button class="btn" id="next">Next ▶</button>
      </div>
    </div>

    <p>📞 (337) 680-0116 | ✉️ hello@creolecrotchet.com</p>
